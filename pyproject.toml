[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gloss-cli"
dynamic = ["version"]
description = "Learn a term once, own it forever — a local-first, AI-powered personal glossary."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gloss contributors" }]
keywords = [
    "glossary",
    "knowledge-base",
    "knowledge-management",
    "cli",
    "llm",
    "personal-knowledge-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "openai>=1.40",
    "tomli-w>=1.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.4",
    "ruff>=0.6",
    # mypy >=1.20 不再支持 python_version="3.9" 目标（也不装在 3.9 解释器上）。
    # 3.9 兼容地板还在，先锁 1.19.x；地板升到 3.10 后放开。
    "mypy>=1.10,<1.20",
]
# 平台专属 GUI：macOS 菜单栏应用用 pyobjc，Windows 原生无边框弹窗用 pywebview(WebView2) + 托盘图标(pystray)
app = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    "pywebview>=5.0; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10.0; sys_platform == 'win32'",
]

[project.scripts]
gloss = "gloss.cli:main"

[project.urls]
Homepage = "https://github.com/zhengqiuyang/gloss"
Issues = "https://github.com/zhengqiuyang/gloss/issues"

[tool.hatch.version]
path = "src/gloss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", ".venv39"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# demo.py 是示例卡片数据（中文长句）；server.py 内嵌 HTML/JS 模板字符串，硬换行更难读
"src/gloss/demo.py" = ["E501"]
"src/gloss/server.py" = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/gloss"]

[tool.coverage.run]
source = ["src/gloss"]

[tool.coverage.report]
fail_under = 72  # 基线 74% - 2，向上棘轮，目标 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
